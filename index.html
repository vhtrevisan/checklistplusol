<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Checklist Elétrico</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">

  <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg p-4 space-y-4">
    <h1 class="text-2xl font-bold text-center text-blue-700 mb-4">Checklist Elétrico</h1>

    <!-- Fachada -->
    <div>
      <label class="block font-semibold mb-1">1. Foto da Fachada</label>
      <input type="file" accept="image/*" onchange="handleFile(event, 'fachada')" class="block w-full mb-2"/>
      <img id="preview-fachada" class="w-full rounded hidden" />
    </div>

    <!-- Padrão -->
    <div>
      <label class="block font-semibold mb-1">2. Foto do Padrão</label>
      <input type="file" accept="image/*" onchange="handleFile(event, 'padrao')" class="block w-full mb-2"/>
      <img id="preview-padrao" class="w-full rounded hidden" />
    </div>

    <!-- Instalação -->
    <div>
      <label class="block font-semibold mb-1">3. Tipo de Instalação</label>
      <label><input type="radio" name="instalacao" value="aerea"/> Aérea</label><br/>
      <label><input type="radio" name="instalacao" value="subterranea"/> Subterrânea</label>
    </div>

    <!-- Medidor -->
    <div>
      <label class="block font-semibold mb-1">4. Foto do Medidor</label>
      <input type="file" accept="image/*" onchange="handleFile(event, 'medidor')" class="block w-full mb-2"/>
      <img id="preview-medidor" class="w-full rounded hidden" />
      <label class="block mt-2">Tipo:</label>
      <label><input type="radio" name="tipo_medidor" value="digital"/> Digital</label><br/>
      <label><input type="radio" name="tipo_medidor" value="analogico"/> Analógico</label>
    </div>

    <!-- Bússola -->
    <div>
      <label class="block font-semibold mb-1">5. Foto da Bússola</label>
      <input type="file" accept="image/*" onchange="handleFile(event, 'bussola')" class="block w-full mb-2"/>
      <img id="preview-bussola" class="w-full rounded hidden" />
      <label>Latitude:</label>
      <input id="latitude" type="text" class="block w-full mb-2 p-2 border rounded" />
      <label>Longitude:</label>
      <input id="longitude" type="text" class="block w-full mb-2 p-2 border rounded" />
    </div>

    <!-- Disjuntor -->
    <div>
      <label class="block font-semibold mb-1">6. Foto do Disjuntor</label>
      <input type="file" accept="image/*" onchange="handleFile(event, 'disjuntor')" class="block w-full mb-2"/>
      <img id="preview-disjuntor" class="w-full rounded hidden" />
      <label>Amperagem:</label>
      <select id="amperagem" class="block w-full p-2 border rounded">
        <option value="">Selecione</option>
        <option value="15A">15A</option><option value="20A">20A</option><option value="30A">30A</option>
        <option value="40A">40A</option><option value="50A">50A</option><option value="60A">60A</option>
      </select>
    </div>

    <!-- Botão -->
    <button onclick="enviarChecklist()" class="w-full bg-green-600 text-white py-3 rounded mt-4">
      Copiar mensagem e abrir WhatsApp
    </button>
  </div>

  <script>
    const dados = {
      fachada: '', padrao: '', instalacao: '', medidor: { foto: '', tipo: '' },
      bussola: { foto: '', latitude: '', longitude: '' },
      disjuntor: { foto: '', amperagem: '' }
    };

    function handleFile(event, campo) {
      const file = event.target.files[0];
      const reader = new FileReader();
      reader.onload = function(e) {
        dados[campo] = e.target.result;
        document.getElementById("preview-" + campo).src = e.target.result;
        document.getElementById("preview-" + campo).classList.remove("hidden");
      };
      if (file) reader.readAsDataURL(file);
    }

    function enviarChecklist() {
      const inst = document.querySelector('input[name="instalacao"]:checked');
      const med = document.querySelector('input[name="tipo_medidor"]:checked');
      dados.instalacao = inst ? inst.value : '';
      dados.medidor.tipo = med ? med.value : '';
      dados.bussola.latitude = document.getElementById("latitude").value;
      dados.bussola.longitude = document.getElementById("longitude").value;
      dados.disjuntor.amperagem = document.getElementById("amperagem").value;

      let msg = "✅ *Checklist Elétrico Completo* ✅\\n\\n";
      msg += "📸 Fachada: Foto OK\\n";
      msg += "🔌 Padrão: Foto OK\\n";
      msg += "⚡ Instalação: " + dados.instalacao + "\\n";
      msg += "📊 Medidor: " + dados.medidor.tipo + " - Foto OK\\n";
      msg += "🧭 Coordenadas: " + dados.bussola.latitude + ", " + dados.bussola.longitude + "\\n";
      msg += "💡 Disjuntor: " + dados.disjuntor.amperagem + " - Foto OK\\n";
      msg += "🕒 " + new Date().toLocaleString();

      navigator.clipboard.writeText(msg).then(() => {
        window.open("https://web.whatsapp.com/", "_blank");
        alert("Mensagem copiada! Cole no grupo do WhatsApp.");
      });
    }
  </script>
</body>
</html>
